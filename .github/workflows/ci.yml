name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Same image as docker-compose.yml; the server's Postgres tests run against it.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: closet
          POSTGRES_PASSWORD: closet
          POSTGRES_DB: closet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U closet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # S3 storage for the server's storage tests. Started by hand rather than as a service:
      # services can't be given SeaweedFS's start command.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Wait for SeaweedFS
        run: timeout 60 sh -c 'until curl -s -o /dev/null http://localhost:8333; do sleep 1; done'
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://closet:closet@localhost:5432/closet_test
          TEST_S3_ENDPOINT: http://localhost:8333
